databases:
  - name: veritas-ai-db
    plan: free
    databaseName: veritas_ai_dev
    user: veritas_user

services:
  - type: web
    name: veritas-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: veritas-ai-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: DEFAULT_PROVIDER
        value: simulated
