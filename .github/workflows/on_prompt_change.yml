name: VERITAS AI — LLM Regression Gate
on:
  pull_request:
    paths:
      - 'app/feature/prompts/**'
      - 'config/model_pricing.yaml'
      - 'config/thresholds.yaml'

jobs:
  regression_gate:
    name: Evaluate Prompt Changes & Statistical Gating
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Fetch Baseline Prompt from Target Branch
        run: |
          git show ${{ github.event.pull_request.base.sha }}:app/feature/prompts/credit_memo_v1.yaml > /tmp/baseline_prompt.yaml

      - name: Execute Regression Engine & Wilcoxon Statistical Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ci/veritas_ci.py \
            --baseline /tmp/baseline_prompt.yaml \
            --candidate app/feature/prompts/credit_memo_v1.yaml \
            --dataset monitoring/golden_set/data/v0001_credit_memo.jsonl
