name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Start PostgreSQL Database
        env:
          DATABASE_URL: postgresql+psycopg2://dev_user:dev_password@127.0.0.1:5435/llm_monitoring_dev
        run: |
          docker compose up -d postgres
          sleep 5 # Wait for DB to be ready
          make migrate

      - name: Run Test Suite
        run: |
          make test

      - name: Run Alembic Migrations against Production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          alembic -c monitoring/db/alembic.ini upgrade head

      - name: Trigger Streamlit Cloud Deploy
        # Assuming Streamlit Cloud is linked to the repository, it will auto-deploy on push to main.
        # This step is largely documentary but could trigger a specific webhook if needed.
        run: |
          echo "Streamlit Cloud will auto-deploy the changes."

      - name: Run Smoke Test against Production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ci/smoke_test.py
