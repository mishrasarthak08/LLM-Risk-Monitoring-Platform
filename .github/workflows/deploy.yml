name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Run Alembic Migrations against Production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          PYTHONPATH=. alembic upgrade head

      - name: Trigger Streamlit Cloud Deploy
        # Assuming Streamlit Cloud is linked to the repository, it will auto-deploy on push to main.
        # This step is largely documentary but could trigger a specific webhook if needed.
        run: |
          echo "Streamlit Cloud will auto-deploy the changes."

      - name: Run Smoke Test against Production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PYTHONPATH=. python ci/smoke_test.py
