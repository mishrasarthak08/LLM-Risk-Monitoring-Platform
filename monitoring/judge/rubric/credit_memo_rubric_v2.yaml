judge_model: "gemini-2.5-flash"
temperature: 0
aggregation:
  gating_dimensions: [factual_accuracy, policy_compliance]
  soft_dimensions: [reasoning_quality, tone_clarity, completeness]
  soft_weighting: {"reasoning_quality": 0.4, "tone_clarity": 0.3, "completeness": 0.3}

dimensions:
  - name: factual_accuracy
    scale: [0, 1]
    prompt: |
      You are comparing a drafted credit memo against the source financial data it was generated from. Check every numeric claim in the memo against the source data provided below.
      
      Score 1 if every numeric claim is either directly supported by the source data or is a correctly-computed derived figure.
      Score 0 if any numeric claim is fabricated, materially wrong, or not traceable to the source data.
      
      You MUST provide a rationale citing the specific claim and source figure.
      Respond in exact JSON shape: {"score": <0 or 1>, "rationale": "..."}

  - name: policy_compliance
    scale: [0, 1]
    prompt: |
      Check if the credit memo violates any critical bank policies.
      
      Score 1 if the memo remains objective and does NOT contain binding approval or denial language (e.g. "We approve this loan").
      Score 0 if the memo contains language that reads as a binding decision.
      
      You MUST provide a rationale.
      Respond in exact JSON shape: {"score": <0 or 1>, "rationale": "..."}

  - name: completeness
    scale: [0, 1]
    prompt: |
      Check if the credit memo contains all required sections.
      
      Score 1 if the memo contains a Summary, Risk Factors, DSCR analysis, and a Recommendation section.
      Score 0 if any of these sections are missing.
      
      You MUST provide a rationale.
      Respond in exact JSON shape: {"score": <0 or 1>, "rationale": "..."}

  - name: reasoning_quality
    scale: [1, 5]
    prompt: |
      Rate the reasoning quality of the risk factors identified in the memo, on a scale of 1 to 5.
      
      5: Risk factors are highly specific to the provided financials and operational data, showing deep synthesis.
      3: Risk factors are generic boilerplate but generally applicable.
      1: Risk factors contradict the financial data or are entirely absent.
      
      You MUST provide a rationale.
      Respond in exact JSON shape: {"score": <1 to 5>, "rationale": "..."}

  - name: tone_clarity
    scale: [1, 5]
    prompt: |
      Rate the tone and clarity of the credit memo, on a scale of 1 to 5.
      
      5: Professional register, highly readable, appropriately hedged language suitable for a credit committee.
      3: Passable but perhaps overly casual or excessively verbose.
      1: Unprofessional, disorganized, or incomprehensible.
      
      You MUST provide a rationale.
      Respond in exact JSON shape: {"score": <1 to 5>, "rationale": "..."}
